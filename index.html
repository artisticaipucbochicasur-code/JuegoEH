html,body{height:100%;margin:0;overflow:hidden;background:#5cb8f0;font-family:"Trebuchet MS","Comic Sans MS",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}

async function next(){mode='next';run=0;carSound(false);K.l=K.r=K.d=K.u=0;T=null;WIN();const tr=$('#tr');if(tr)tr.classList.add('a');fx(['🎁','⭐','✨',FRU[LV]],24,Math.min(W-40,Math.max(40,endX-cam)),H-G-40);await sleep(800);const fin=LV>=9;pgSave(fin?0:LV+1,fin);await celebrate(fin);if(fin)score=0;build(fin?0:LV+1)}
function frame(t){if(mode!='play'){run=0;carSound(false);return false}const dt=Math.max(0,Math.min(.04,(t-last)/1000));last=t;
const nz=zones.find(z=>!z.done);wall=sea?(nz?nz.x+500:endX+300):(nz?nz.x+380:endX+120);let moved=0,crouch=0,bob=0;
if(sea){let dx=K.r-K.l,dy=K.u-K.d;if(T){const sx=px-cam,sy=H-(G-10)-gy-PH/2;dx=Math.abs(T.x-sx)>25?Math.sign(T.x-sx):0;dy=Math.abs(T.y-sy)>25?-Math.sign(T.y-sy):0}
let m=0;if(dx){face=dx;m=dx*280*dt}else if(stepRem){m=Math.sign(stepRem)*Math.min(Math.abs(stepRem),200*dt);stepRem-=m;face=Math.sign(m)||face}
// softer wall: only block if very close to unfinished zone blocks
const softWall = nz ? nz.x + 200 : endX + 200;
const np=Math.max(30,Math.min(softWall,px+m)),ng=Math.max(5,Math.min(H-G-PH-40,gy+dy*240*dt));moved=(np!=px||ng!=gy)?1:0;px=np;gy=ng;vy=0;bob=Math.sin(t/350)*6;
zones.forEach(z=>{if(!z.done&&Math.abs(z.x-px)<400)z.bl.forEach(b=>{if(!z.done&&!b.dead&&Math.abs(px-b.bx)<39+PW*.35&&gy+PH*.85>b.by&&gy+PH*.15<b.by+78){hit(z,b);px-=face*80}})});
if(moved&&Math.random()<.2)bubble();
fishes.forEach(f=>{if(Math.abs(f.x-px)<170&&Math.abs(f.y-gy)<170){const d=f.x<px?-1:1;f.x+=d*280;f.el.style.left=f.x+'px';f.el.style.transform=`scaleX(${d>0?-1:1})`}});
anim+=dt*(moved?9:3);setFrame(Math.floor(anim)%8)}
else{const dir=K.r-K.l;crouch=K.d&&onG()&&!car;
const spd=(car?400:310)*speedMul;
if(dir){face=dir;moved=mv(dir*(crouch?110:spd)*dt);if(car&&moved&&Math.random()<.35){const d=document.createElement('i');d.className='dust';d.style.left=(px-cam-face*PW*.3)+'px';d.style.bottom=(G+5)+'px';d.style.setProperty('--dx',(-face*(30+R(50)))+'px');d.style.setProperty('--dy',(-5-R(25))+'px');$('#stage').appendChild(d);setTimeout(()=>d.remove(),600)}}else if(stepRem){const m=Math.sign(stepRem)*Math.min(Math.abs(stepRem),170*dt);face=Math.sign(m);moved=mv(m);stepRem-=m;if(!moved)stepRem=0}
const flInfo=floorAt(px),fl=flInfo.h;
if(gy>fl||vy>0){vy-=2300*dt;gy+=vy*dt;if(gy<=fl&&vy<=0){gy=fl;vy=0;
if(flInfo.bounce&&!car){vy=Math.sqrt(2*2300*JHt()*1.7);JMP();fx(['🍄','✨','⬆️'],12,px-cam,H-G-gy)}
if(flInfo.mystery&&!flInfo.mystery.used){flInfo.mystery.used=1;
document.querySelectorAll('.stp.mystery').forEach(el=>{if(el.style.left.startsWith(flInfo.mystery.x1+'px')||el.style.left.startsWith(flInfo.mystery.x1+' ')){el.textContent='✨';el.style.animation='none';el.style.filter='grayscale(.6) brightness(.8)'}});
const pwrs=['🚀','⚡','🧲','🛡️','💥','❤️','💥'];givePower(pwrs[R(pwrs.length)]);fx(['❓','⭐','✨'],18,px-cam,H-G-gy)}
}}else if(gy<fl)gy=fl;
for(const k in pt)if(pt[k]>0)pt[k]=Math.max(0,pt[k]-dt);syncPow();updatePwr();
const bb=GH+26;if(vy>0)zones.forEach(z=>{if(!z.done&&Math.abs(z.x-px)<400)z.bl.forEach(b=>{if(!b.dead&&vy>0){const hd=gy+(car?PH*0.9:GH);if(hd>=bb&&hd<=bb+70&&Math.abs(px-b.bx)<39+(car?PW:GW)*.28){hit(z,b);vy=z.done?700:-250}}})});
if(car){/* gif handles anim */}else if(!onG())setFrame(2);else if(moved){anim+=dt*11*(crouch?.5:1);setFrame(Math.floor(anim)%8)}else{setFrame(0);anim=0}}
cam=Math.max(0,Math.min(endX+300-W,px-W*.3));
$('#pl').style.left=(px-PW/2)+'px';$('#pl').style.transform=`translateY(${-gy+bob}px) scaleX(${face}) scaleY(${crouch?.76:1})`;
world.style.transform=`translateX(${-cam}px)`;$('#cl').style.backgroundPositionX=-cam*.12+'px';$('#hl').style.backgroundPositionX=-cam*.3+'px';$('#gr').style.backgroundPositionX=-cam+'px';
coins.forEach((c,i)=>{if(!c.on)return;const dist=Math.abs(c.x-px);const reach=magnet?PW*2.5:PW*.55;if(dist<reach&&c.hc>gy-50&&c.hc<gy+PH+40){if(magnet&&dist>PW*.6){c.x+=(px-c.x)*.18;c.hc+=(gy+PH*.5-c.hc)*.12;const el=$('#c'+i);if(el){el.style.left=(c.x-19)+'px';el.style.bottom=`calc(var(--g) - 10px + ${c.hc}px)`}}else{c.on=0;$('#c'+i).remove();score++;hud();COIN();fx(['✨'],4,c.x-cam,H-G-c.hc)}}});
if(car)carSound(!!(moved||K.r||K.l));else carSound(false);

// animalitos: solo hacen daño al tocar los pies
enemies.forEach(e=>{
  if(e.dead)return;
  const el=$('#'+e.id);if(!el)return;
  const nx=e.x+e.dir*e.spd*dt;
  if(nx<100||nx>endX||floorAt(nx+e.dir*20,0).h>22)e.dir*=-1;else e.x=nx;
  el.style.left=(e.x-22)+'px';
  el.style.transform=`scaleX(${e.dir})`;
  const fw=car?PW*.3:GW*.12;
  if(Math.abs(e.x-px)<fw+16&&gy<34){
    if(vy<-80&&gy>6){
      e.dead=1;el.classList.add('dead');score+=1;hud();COIN();
      fx(['⭐','💥'],8,e.x-cam,H-G-20);setTimeout(()=>el.remove(),600);
      vy=500;
    }else if(!e.hitCD){
      e.hitCD=1;setTimeout(()=>e.hitCD=0,1200);
      if(shield){
        pt['🛡️']=0;syncPow();updatePwr();
        fx(['🛡️','✨'],8,px-cam,H-G-gy);
        say('¡Escudo!');
      }else{
        LOSE();lives--;hud();
        $('#pi').classList.add('no');
        setTimeout(()=>$('#pi').classList.remove('no'),500);
        if(lives<=0){mode='over';panel.hidden=true;$('#over').hidden=false;say('¡Casi! Vamos otra vez, tú puedes.')}
        else say('¡Cuidado!');
      }
    }
  }
});
trees.forEach(tr=>{if(!tr.sw&&Math.abs(tr.x-px)<55){tr.sw=1;tr.el.classList.add('sw');setTimeout(()=>{tr.el.classList.remove('sw');tr.sw=0},900);if(Math.random()<.4)fx(['🍃','🍂'],3,tr.x-cam,H-G-80)}});
if(nz&&px>nz.x-W*.9){if(panel.hidden){$('#pv').innerHTML=nz.ch.pv;panel.hidden=false;$('#rep').onclick=()=>say(nz.ch.say)}if(!nz.sp){nz.sp=1;say(nz.ch.say)}}else if(nz&&px<nz.x-W*.95)panel.hidden=true;
if(!nz&&px>=endX-60){next();return false}
return true}
function loop(t){let c=false;try{c=frame(t)}catch(err){console.error(err);c=mode=='play'}if(c)requestAnimationFrame(loop)}

function press(d){if(d=='d'){K.d=1;return}const o={t:setTimeout(()=>{o.on=1;K[d]=1},200),d};return o}
function release(o){if(!o)return;if(o=='d'){K.d=0;return}clearTimeout(o.t);if(o.on)K[o.d]=0;else stepRem+=(o.d=='r'?1:-1)*70}
const S=$('#stage');
S.addEventListener('pointerdown',e=>{if(mode!='play'||e.target.closest('#rep,#ctl,#bs,#mbtn,#menu'))return;S.setPointerCapture(e.pointerId);const r=S.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
if(sea){T={x,y};P[e.pointerId]='T';return}
const gx=px-cam,head=H-(G-10)-gy-PH;if(y<head-8){jump();return}const dx=x-gx;P[e.pointerId]=Math.abs(dx)<GW*.45?(K.d=1,'d'):press(dx>0?'r':'l')});
S.addEventListener('pointermove',e=>{if(sea&&P[e.pointerId]=='T'){const r=S.getBoundingClientRect();T={x:e.clientX-r.left,y:e.clientY-r.top}}});
['pointerup','pointercancel'].forEach(n=>S.addEventListener(n,e=>{if(P[e.pointerId]=='T')T=null;else release(P[e.pointerId]);delete P[e.pointerId]}));
const BP={};
function btn(id,down,up){const b=$('#'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.setPointerCapture(e.pointerId);b.classList.add('on');BP[id]=down()});['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,e=>{b.classList.remove('on');up(BP[id]);BP[id]=null}))}
btn('bl',()=>mode=='play'?press('l'):0,release);btn('br',()=>mode=='play'?press('r'):0,release);
btn('bs',()=>{shoot()},()=>{});btn('bd',()=>{K.d=1},()=>{K.d=0});btn('bu',()=>{if(sea)K.u=1;else jump()},()=>{K.u=0});
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowDown:'d',s:'d'},KP={},UP=k=>k=='ArrowUp'||k=='w'||k==' ';
addEventListener('keydown',e=>{if(e.code==='Space'&&canShoot&&mode=='play'&&!sea){e.preventDefault();if(!e.repeat)shoot();return}if(UP(e.key)){e.preventDefault();if(sea)K.u=1;else jump();return}const d=KM[e.key];if(d&&!e.repeat&&mode=='play')KP[e.key]=press(d)});
addEventListener('keyup',e=>{if(UP(e.key)){K.u=0;return}const d=KM[e.key];if(d){release(d=='d'?'d':KP[e.key]);delete KP[e.key]}});
document.addEventListener('contextmenu',e=>e.preventDefault());
$('#again').onclick=()=>build(LV);



// ===== progreso guardado =====
const PGK='eliz-progress-v1';let PG={cur:0,unl:1,score:0};
try{const s=JSON.parse(localStorage.getItem(PGK)||'null');if(s&&typeof s=='object'){PG.cur=Math.min(9,Math.max(0,s.cur|0));PG.unl=Math.min(10,Math.max(PG.cur+1,(s.unl|0)||1));PG.score=Math.max(0,s.score|0)}}catch(e){}
function pgSave(L,all){PG.cur=L;PG.unl=all?10:Math.max(PG.unl,L+1);PG.score=score;try{localStorage.setItem(PGK,JSON.stringify(PG))}catch(e){}}
// salto: en horizontal (pantalla baja) se mantiene la altura de salto de un teléfono vertical
function JHt(){return Math.max(GH,W>H?190:0)}
// ===== menú de niveles =====
let pm='play';
const lvIcon=i=>CAR.includes(i)?'🚗':SEA.includes(i)?'🌊':'🌳';
function renderMenu(){const g=$('#lvg');g.innerHTML='';for(let i=0;i<10;i++){const b=document.createElement('button'),ok=i<PG.unl;b.className='lv'+(i===PG.cur?' cur':'');b.disabled=!ok;b.setAttribute('aria-label','Nivel '+(i+1));b.innerHTML=`<span>${ok?FRU[i]:'🔒'}</span>${i+1} ${ok?lvIcon(i):''}`;if(ok)b.onclick=()=>playLevel(i);g.appendChild(b)}}
function openMenu(){if(mode!='play'&&mode!='over')return;pm=mode;mode='menu';K.l=K.r=K.d=K.u=0;T=null;P={};stepRem=0;carSound(false);try{speechSynthesis.cancel()}catch(e){}renderMenu();$('#menuClose').textContent='▶ Seguir jugando';$('#menu').hidden=false}
function closeMenu(){$('#menu').hidden=true;if(mode=='menu'){mode=pm;if(mode=='play'&&!run){run=1;last=performance.now();requestAnimationFrame(loop)}}}
function playLevel(L){const first=!!$('#intro'),cont=L===PG.cur;$('#menu').hidden=true;if(first){$('#intro').remove();snd([523],.1);say(PG.cur>0||PG.unl>1?'¡Vamos a seguir jugando!':'¡Hola! Vamos a pasear por el bosque.')}score=cont?PG.score:0;$('#mbtn').hidden=false;build(L)}
if(PG.cur>0||PG.unl>1){$('#start').hidden=true;$('#cont').hidden=false;$('#cont').textContent='▶ Continuar · Nivel '+(PG.cur+1);$('#lvbtn').hidden=false}
$('#start').onclick=()=>playLevel(0);
$('#cont').onclick=()=>playLevel(PG.cur);
$('#lvbtn').onclick=()=>{renderMenu();$('#menuClose').textContent='⬅ Volver';$('#menu').hidden=false};
$('#mbtn').onclick=openMenu;
$('#menuClose').onclick=closeMenu;
// ===== adaptar al girar el teléfono =====
function relayout(){if(mode!='play'&&mode!='menu')return;const oldHG=H-G;size();const r=oldHG>0?(H-G)/oldHG:1;
 zones.forEach(z=>z.bl.forEach(b=>{b.by=sea?b.by*r:GH+26;const el=$('#'+b.id);if(el)el.style.bottom=`calc(var(--g) - 10px + ${b.by}px)`}));
 if(sea){fishes.forEach(f=>{f.y*=r;if(f.el)f.el.style.bottom=`calc(var(--g) + ${f.y}px)`});gy=Math.max(5,Math.min(H-G-PH-40,gy*r))}}
addEventListener('resize',relayout);
addEventListener('orientationchange',()=>setTimeout(relayout,350));
// ===== instalar PWA =====
let dip=null;
const isStandalone=()=>['standalone','fullscreen','minimal-ui'].some(m=>matchMedia(`(display-mode: ${m})`).matches)||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function updInst(){const show=!isStandalone()&&(!!dip||isIOS);document.querySelectorAll('.inst').forEach(b=>b.hidden=!show)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;updInst()});
addEventListener('appinstalled',()=>{dip=null;updInst()});
try{matchMedia('(display-mode: standalone)').addEventListener('change',updInst)}catch(e){}
document.querySelectorAll('.inst').forEach(b=>b.onclick=async()=>{
 if(dip){try{dip.prompt();await dip.userChoice}catch(e){}dip=null;updInst()}
 else if(isIOS)alert('Para instalar: toca el botón Compartir y luego «Añadir a pantalla de inicio».')});
updInst();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
