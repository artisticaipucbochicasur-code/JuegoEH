<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paseo por el bosque</title><style>
:root{--card:#fffaf0;--ink:#2f3b2a;--g:21%;--s1:#5cb8f0;--s2:#d6f1ff;--hill:#8fd17a;--leaf:#3f9b3f;--grass:#58b43c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2c3a33;--ink:#f3f1e4}}
:root[data-theme="dark"]{--card:#2c3a33;--ink:#f3f1e4}
#over[hidden]{display:none}.stp{position:absolute;z-index:2;background:linear-gradient(var(--grass) 0 12px,#9a6a3a 12px);border-radius:6px 6px 0 0;box-shadow:inset -3px 0 0 #0002}.t{transform-origin:50% 100%}.t.sw{animation:sway .8s}@keyframes sway{30%{transform:rotate(-5deg)}70%{transform:rotate(5deg)}}.bx{display:inline-block;width:34px;height:28px;border:4px solid #5a3400;border-top:none;font-size:20px;line-height:24px;vertical-align:bottom}.blk.o{font-size:20px;white-space:nowrap}#stage{touch-action:none}#ctl{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 12px;z-index:10;pointer-events:none}
#ctl>div{display:flex;gap:10px;pointer-events:auto}
#ctl button{width:70px;height:70px;border-radius:22px;border:1.5px solid #ffffff99;background:linear-gradient(145deg,#ffffff66,#ffffff22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 20px #0004,inset 0 1px 0 #fffa;display:grid;place-items:center;touch-action:none;padding:0;cursor:pointer;transition:transform .08s,background .1s}
#ctl svg{width:34px;height:34px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px #0006)}
#ctl button.on{transform:scale(.9);background:linear-gradient(145deg,#ffa25ce6,#e8563ae6)}
#stage.sea{background:linear-gradient(#2aa4e8,#0b4a8a 85%)}#stage.sea #cl,#stage.sea #hl,#stage.sea #gr::before{display:none}
#stage.sea::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,#ffffff1c 0 40px,transparent 40px 130px);z-index:1;pointer-events:none}
#stage.sea #gr{background:linear-gradient(#f3d98f 0 14px,#d8b26a 14px);border-top:3px solid #c9a24f}
#stage.sea #gr::after{background:radial-gradient(circle,#c79a52 0 3px,transparent 4px) 0 0/46px 34px,radial-gradient(circle,#efd08a 0 2px,transparent 3px) 20px 14px/38px 30px}
.sea-fish{position:absolute;font-size:44px;transition:left .8s ease-out;animation:bobf 2s ease-in-out infinite alternate}@keyframes bobf{to{margin-bottom:12px}}
.bub{position:absolute;display:block;width:12px;height:12px;border:2px solid #fffb;border-radius:50%;animation:rise 3s ease-out forwards}.bub.d{animation:rise 8s linear infinite}
@keyframes rise{to{transform:translateY(-60vh);opacity:0}}
.ob{position:absolute;z-index:2}
.log{background:radial-gradient(circle at 90% 50%,#e3b778 0 6px,#c18c50 7px 12px,#e3b778 13px 17px,transparent 18px),linear-gradient(#a8743c,#7d4f26);border-radius:28px}
.trunk{background:repeating-linear-gradient(90deg,#7a4a22 0 10px,#8a5a2e 10px 20px);border-radius:10px 10px 0 0;border-top:9px solid #5e9b4a}
.rock{background:radial-gradient(circle at 35% 30%,#bfc3ca,#7f858f 70%);border-radius:50% 50% 8px 8px/75% 75% 8px 8px;box-shadow:inset -8px -6px 0 #0002}
.mush{background:radial-gradient(circle at 25% 45%,#fff 0 7px,transparent 8px),radial-gradient(circle at 62% 28%,#fff 0 9px,transparent 10px),radial-gradient(circle at 82% 55%,#fff 0 6px,transparent 7px),#e53935;border-radius:50% 50% 8px 8px/100% 100% 8px 8px;transform-origin:50% 100%}
.mush.sq{animation:sq .4s}@keyframes sq{40%{transform:scale(1.25,.6)}70%{transform:scale(.9,1.2)}}
.gate{position:absolute;bottom:calc(var(--g) - 8px);width:64px;font-size:56px;line-height:.95;z-index:3;transition:transform .8s,opacity .8s;text-align:center}
.gate.open{transform:translateY(-140px) rotate(25deg);opacity:0;pointer-events:none}.gate.sh{animation:wob2 .5s}@keyframes wob2{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
html,body{height:100%;margin:0;overflow:hidden;background:#5cb8f0;font-family:"Trebuchet MS","Comic Sans MS",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;height:100%;overflow:hidden;background:linear-gradient(var(--s1),var(--s2) 70%)}
#cl,#hl{position:absolute;left:0;right:0;background-repeat:repeat-x}
#cl{top:6%;height:20%;background-image:radial-gradient(ellipse 50px 22px at 60px 40px,#fff 70%,transparent 72%),radial-gradient(ellipse 40px 18px at 100px 30px,#fff 70%,transparent 72%),radial-gradient(ellipse 45px 20px at 30px 32px,#fff 70%,transparent 72%);background-size:380px 100%}
#hl{bottom:var(--g);height:34%;background-image:radial-gradient(ellipse 260px 120px at 200px 100%,var(--hill) 97%,transparent 100%),radial-gradient(ellipse 200px 90px at 520px 100%,var(--hill) 97%,transparent 100%);background-size:700px 100%;filter:brightness(1.08)}
#world{position:absolute;inset:0}
.t{position:absolute;bottom:calc(var(--g) - 6px);overflow:visible}
.st{position:absolute;bottom:calc(var(--g) - 6px);font-size:86px;line-height:1}
.st.a{animation:hop .6s ease-out 2}.st.s{animation:sad .5s}
@keyframes hop{40%{transform:translateY(-40px) scale(1.1)}}@keyframes sad{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.c{position:absolute;font-size:38px;animation:fl 1.2s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-8px)}}
#gr{position:absolute;left:0;right:0;bottom:0;height:var(--g);background:linear-gradient(var(--grass) 0 14px,#8a5a2e 14px),#8a5a2e;border-top:3px solid #3d8a2b}
#gr::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:conic-gradient(from 135deg at 50% 0,transparent 0 90deg,var(--grass) 90deg 270deg,transparent 270deg) 0 0/22px 16px repeat-x;transform:translateY(-8px)}
#gr::after{content:"";position:absolute;inset:22px 0 0;background:radial-gradient(circle,#6d4521 0 3px,transparent 4px) 0 0/46px 34px,radial-gradient(circle,#a37444 0 2px,transparent 3px) 20px 14px/38px 30px}
#pl{position:absolute;bottom:calc(var(--g) - 10px);z-index:5;transform-origin:50% 100%;filter:drop-shadow(0 5px 3px #0004)}
#pi{position:relative;width:100%;height:100%;transform-origin:50% 100%}#pi img{position:absolute;inset:0;width:100%;height:100%;display:none}#pi img.on{display:block}
#pi.no{animation:wob .6s}@keyframes wob{20%{transform:rotate(-9deg)}60%{transform:rotate(9deg)}}
.blk.dead{opacity:.45;filter:grayscale(.8)}.blk{position:absolute;width:78px;height:78px;border-radius:12px;border:5px solid #7a4a1e;box-shadow:inset 0 -8px 0 #0003,0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#3a2200;background:#ffcf4a;cursor:pointer;z-index:4;animation:fl .9s ease-in-out infinite alternate}
.blk small{font-size:11px;letter-spacing:1px;color:#5a3400}
.blk.bump{animation:bump .35s}.blk.bad{animation:bad .5s}.blk.good{background:#7ee07e;animation:bump .35s}
@keyframes bump{40%{transform:translateY(-22px)}}@keyframes bad{20%{transform:translateX(-10px)}50%{transform:translateX(10px)}80%{transform:translateX(-6px)}}
#panel{position:absolute;left:50%;top:max(8px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(540px,94%);background:var(--card);border-radius:24px;padding:10px 14px;box-shadow:0 6px 0 #0003;text-align:center;z-index:9;display:flex;align-items:center;justify-content:center;gap:12px}
#panel[hidden],#ban[hidden]{display:none}
#pv{font-size:40px;line-height:1.1;font-weight:800}
#rep{border:0;background:#ffd84d;border-radius:50%;width:56px;height:56px;font-size:28px;cursor:pointer}
#hud{position:absolute;right:10px;top:calc(84px + env(safe-area-inset-top,0px));font-size:28px;z-index:6;background:#fffaf0dd;color:#2f3b2a;border-radius:16px;padding:2px 12px}
#ban{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ban div{font-size:clamp(40px,11vw,80px);font-weight:900;color:#fff;background:#e8563acc;padding:10px 36px;border-radius:40px;text-shadow:0 4px 0 #0004;animation:ban 1.5s both}
@keyframes ban{0%{transform:scale(0) rotate(-20deg)}25%{transform:scale(1.2) rotate(4deg)}40%{transform:scale(1)}80%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
.cf{position:absolute;z-index:12;font-size:30px;pointer-events:none;animation:cf 1.4s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
#intro,#over{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#2f6b3aee;color:#fff;text-align:center;padding:20px}
#intro h1,#over h1{font-size:clamp(34px,8vw,60px);margin:0}
.go{font:inherit;font-size:30px;font-weight:700;padding:12px 34px;border-radius:30px;border:0;background:#ffd84d;color:#4a3300;cursor:pointer;box-shadow:0 6px 0 #c9a21e}
.go:focus-visible,#rep:focus-visible,.blk:focus-visible{outline:4px solid #2f7fd6;outline-offset:2px}
</style></head><body><div id="stage">
<div id="cl"></div><div id="hl"></div><div id="world"></div><div id="gr"></div>
<div id="ctl"><div><button id="bl" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="br" aria-label="Adelante"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div><div><button id="bd" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button><button id="bu" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button></div></div><div id="panel" hidden><div id="pv"></div><button id="rep" aria-label="Escuchar otra vez">🔊</button></div><div id="hud">🍌 0</div><div id="ban" hidden></div><div id="over" hidden><h1>¡Casi, Elizabeth! 💪</h1><button class="go" id="again">Intentar otra vez</button></div>
<div id="intro"><h1>Elizabeth en el bosque 🌳</h1><p style="font-size:22px;margin:0">Usa los botones de abajo, o toca la pantalla. Salta debajo del bloque correcto. ¡Y en el mar, nada hasta él!</p><button class="go" id="start">¡Vamos!</button></div></div>

if(sea){for(let x=300;x<endX;x+=260+R(260)){const y=40+R(Math.max(80,H-G-200));fishes.push({x,y});h+=`<span class="sea-fish" id="f${fishes.length-1}" style="left:${x}px;bottom:calc(var(--g) + ${y}px)">${['🐟','🐠','🐡','🦑'][R(4)]}</span>`}for(let x=0;x<end;x+=140)h+=`<i class="bub d" style="left:${x+R(100)}px;bottom:calc(var(--g) + ${R(200)}px);animation-delay:${R(8)}s;width:${8+R(10)}px;height:${8+R(10)}px"></i>`}
h+=`<span class="st" id="tr" style="left:${endX}px">🎁</span>`;
for(let x=500;x<endX;x+=210+R(160))pc(x,20+R(sea?Math.max(60,H-G-PH-150):GH+60));

world.innerHTML=h;world.querySelectorAll('svg.t').forEach((e,i)=>trees[i].el=e);size();px=120;gy=sea?40:0;vy=0;cam=0;stepRem=0;fi=-1;T=null;fishes.forEach((f,i)=>f.el=$('#f'+i));if(sea)zones.forEach(z=>z.ch.say=z.ch.say.replace(/salta debajo del /i,'nada hasta el ').replace(/salta debajo de /i,'nada hasta '));hud();panel.hidden=true;$('#over').hidden=true;mode='play';setFrame(0);banner(L);setTimeout(()=>say(sea?'¡Al mar, Elizabeth! Vamos a nadar.':`¡Nivel ${L+1}, Elizabeth!`),300);if(!run){run=1;last=performance.now();requestAnimationFrame(loop)}}
function setFrame(i){if(i===fi)return;fi=i;const im=$('#pi').children;for(let k=0;k<im.length;k++)im[k].className=k==i?'on':''}
function fx(emoji,n,cx,cy){for(let i=0;i<n;i++){const e=document.createElement('span');e.className='cf';e.textContent=emoji[i%emoji.length];e.style.left=cx+'px';e.style.top=cy+'px';e.style.setProperty('--dx',(R(500)-250)+'px');e.style.setProperty('--dy',(R(300)-200+(i%2?250:0))+'px');$('#stage').appendChild(e);setTimeout(()=>e.remove(),1500)}}
async function banner(L){const b=$('#ban');b.hidden=false;b.innerHTML=`<div>${FRU[L]} Nivel ${L+1}${SEA.includes(L)?' 🌊':''} ${FRU[L]}</div>`;WIN();fx([FRU[L],'⭐'],14,W/2,H*.4);await sleep(1500);b.hidden=true}
const floorAt=x=>{let f=0,b=null;for(const s of steps)if(s.x1<=x+10&&s.x2>=x-10&&s.h>f){f=s.h;b=s}FS=b;return f};
const onG=()=>gy<=floorAt(px)+.5&&vy<=0;
function mv(dx){if(!dx)return 0;const nx=Math.max(40,Math.min(wall,px+dx)),f2=floorAt(nx),g=onG();if(f2-gy>40){if(g&&!K.d){vy=Math.sqrt(2*2300*Math.min(f2-gy+40,GH*.95));JMP()}return 0}const o=px;px=nx;if(g&&f2>gy)gy=f2;return px!=o?1:0}
function jump(){if(onG()&&!K.d&&mode=='play'){vy=Math.sqrt(2*2300*GH*.72);JMP()}}
function hit(z,b){const el=$('#'+b.id),an=$('#a'+z.k),ok=String(b.o.k)==String(z.ch.a),sx=b.bx-cam,sy=H-G-(b.by||0)-20;BUMP();
if(ok){z.done=1;score+=2;hud();$('#g'+z.k).classList.add('open');el.classList.add('good');z.bl.forEach(o=>{if(o!=b)$('#'+o.id).classList.add('dead')});WIN();fx(['⭐','🎉',FRU[LV],'✨'],24,sx,sy);an.classList.add('a');setTimeout(()=>an.classList.remove('a'),1300);say(['¡Muy bien, Elizabeth!','¡Lo lograste, Elizabeth!','¡Eso es, Elizabeth!','¡Qué lista eres, Elizabeth!'][R(4)]);if(!sea)vy=700;panel.hidden=true}
else{b.dead=1;el.classList.add('bad','dead');setTimeout(()=>el.classList.remove('bad'),500);LOSE();lives--;hud();$('#pi').classList.add('no');an.classList.add('s');setTimeout(()=>{$('#pi').classList.remove('no');an.classList.remove('s')},700);
if(lives<=0){mode='over';panel.hidden=true;$('#over').hidden=false;say('¡Casi, Elizabeth! Vamos otra vez, tú puedes.')}else say('Uy, casi. Escucha otra vez. '+z.ch.say)}}
function bubble(){const e=document.createElement('i');e.className='bub';e.style.left=(px+face*PW*.4)+'px';e.style.bottom=`calc(var(--g) + ${gy+PH*.6}px)`;world.appendChild(e);setTimeout(()=>e.remove(),3000)}
function loop(t){if(mode!='play'){run=0;return}const dt=Math.min(.04,(t-last)/1000);last=t;
const nz=zones.find(z=>!z.done);wall=nz?nz.x+200:endX+120;let moved=0,crouch=0,bob=0;
if(sea){let dx=K.r-K.l,dy=K.u-K.d;if(T){const sx=px-cam,sy=H-(G-10)-gy-PH/2;dx=Math.abs(T.x-sx)>30?Math.sign(T.x-sx):0;dy=Math.abs(T.y-sy)>30?-Math.sign(T.y-sy):0}
let m=0;if(dx){face=dx;m=dx*250*dt}else if(stepRem){m=Math.sign(stepRem)*Math.min(Math.abs(stepRem),170*dt);stepRem-=m;face=Math.sign(m)||face}
const np=Math.max(40,Math.min(wall,px+m)),ng=Math.max(0,Math.min(H-G-PH-110,gy+dy*210*dt));moved=(np!=px||ng!=gy)?1:0;px=np;gy=ng;vy=0;bob=Math.sin(t/350)*5;
zones.forEach(z=>{if(!z.done&&Math.abs(z.x-px)<400)z.bl.forEach(b=>{if(!z.done&&!b.dead&&Math.abs(px-b.bx)<39+PW*.35&&gy+PH*.85>b.by&&gy+PH*.15<b.by+78){hit(z,b);px-=face*80}})});
if(moved&&Math.random()<.2)bubble();
fishes.forEach(f=>{if(Math.abs(f.x-px)<170&&Math.abs(f.y-gy)<170){const d=f.x<px?-1:1;f.x+=d*280;f.el.style.left=f.x+'px';f.el.style.transform=`scaleX(${d>0?-1:1})`}});
anim+=dt*(moved?9:3);setFrame(Math.floor(anim)%8)}
else{const dir=K.r-K.l;crouch=K.d&&onG();
if(dir){face=dir;moved=mv(dir*(crouch?110:310)*dt)}else if(stepRem){const m=Math.sign(stepRem)*Math.min(Math.abs(stepRem),170*dt);face=Math.sign(m);moved=mv(m);stepRem-=m;if(!moved)stepRem=0}
const fl=floorAt(px);if(gy>fl||vy>0){vy-=2300*dt;gy+=vy*dt;if(gy<=fl&&vy<=0){gy=fl;if(FS&&FS.t=='mush'&&vy<-250){vy=Math.sqrt(2*2300*GH*1.7);snd([200,500,900],.06,'sine');const m=$('#'+FS.id);m.classList.remove('sq');void m.offsetWidth;m.classList.add('sq')}else vy=0}}else if(gy<fl)gy=fl;
const bb=GH+26;if(vy>0)zones.forEach(z=>{if(!z.done&&Math.abs(z.x-px)<400)z.bl.forEach(b=>{if(!b.dead&&vy>0){const hd=gy+GH;if(hd>=bb&&hd<=bb+60&&Math.abs(px-b.bx)<39+GW*.2){hit(z,b);vy=z.done?700:-250}}})});
if(!onG())setFrame(2);else if(moved){anim+=dt*11*(crouch?.5:1);setFrame(Math.floor(anim)%8)}else{setFrame(0);anim=0}}
if(nz&&px>=wall-2&&(K.r||stepRem>0||(T&&T.x>px-cam))&&t-lb>5000){lb=t;const g=$('#g'+nz.k);g.classList.add('sh');setTimeout(()=>g.classList.remove('sh'),500);say('Elizabeth, primero responde la pregunta.')}
cam=Math.max(0,Math.min(endX+300-W,px-W*.3));
$('#pl').style.left=(px-PW/2)+'px';$('#pl').style.transform=`translateY(${-gy+bob}px) scaleX(${face}) scaleY(${crouch?.76:1})`;
world.style.transform=`translateX(${-cam}px)`;$('#cl').style.backgroundPositionX=-cam*.12+'px';$('#hl').style.backgroundPositionX=-cam*.3+'px';$('#gr').style.backgroundPositionX=-cam+'px';
coins.forEach((c,i)=>{if(c.on&&Math.abs(c.x-px)<PW*.55&&c.hc>gy-30&&c.hc<gy+PH){c.on=0;$('#c'+i).remove();score++;hud();COIN();if(score%5==0)say(`¡Muy bien, Elizabeth! Llevas ${score}.`);fx(['✨'],4,c.x-cam,H-G-c.hc)}});
trees.forEach(tr=>{if(!tr.sw&&Math.abs(tr.x-px)<45){tr.sw=1;tr.el.classList.add('sw');setTimeout(()=>{tr.el.classList.remove('sw');tr.sw=0},900)}});
if(nz&&px>nz.x-W*.9){if(panel.hidden){$('#pv').innerHTML=nz.ch.pv;panel.hidden=false;$('#rep').onclick=()=>say(nz.ch.say)}if(!nz.sp){nz.sp=1;say(nz.ch.say)}}else if(nz&&px<nz.x-W*.95)panel.hidden=true;
if(!nz&&px>=endX-60){next();return}
requestAnimationFrame(loop)}
async function next(){mode='next';run=0;WIN();fx(['🎉','⭐','🎊',FRU[LV]],40,W/2,H*.4);if(LV<9){say('¡Muy bien, Elizabeth! Pasamos de nivel.');await sleep(2200);build(LV+1)}else{panel.hidden=false;$('#pv').innerHTML='¡Ganaste, Elizabeth! 🏆🎁';$('#rep').textContent='🔁';$('#rep').onclick=()=>{$('#rep').textContent='🔊';score=0;build(0)};say('¡Lo logramos, Elizabeth! Terminamos todos los niveles. ¡Eres una campeona!')}}
function press(d){if(d=='d'){K.d=1;return}const o={t:setTimeout(()=>{o.on=1;K[d]=1},200),d};return o}
function release(o){if(!o)return;if(o=='d'){K.d=0;return}clearTimeout(o.t);if(o.on)K[o.d]=0;else stepRem+=(o.d=='r'?1:-1)*70}
const S=$('#stage');
S.addEventListener('pointerdown',e=>{if(mode!='play'||e.target.closest('#rep,#ctl'))return;S.setPointerCapture(e.pointerId);const r=S.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
if(sea){T={x,y};P[e.pointerId]='T';return}
const gx=px-cam,head=H-(G-10)-gy-PH;if(y<head-8){jump();return}const dx=x-gx;P[e.pointerId]=Math.abs(dx)<GW*.45?(K.d=1,'d'):press(dx>0?'r':'l')});
S.addEventListener('pointermove',e=>{if(sea&&P[e.pointerId]=='T'){const r=S.getBoundingClientRect();T={x:e.clientX-r.left,y:e.clientY-r.top}}});
['pointerup','pointercancel'].forEach(n=>S.addEventListener(n,e=>{if(P[e.pointerId]=='T')T=null;else release(P[e.pointerId]);delete P[e.pointerId]}));
const BP={};
function btn(id,down,up){const b=$('#'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.setPointerCapture(e.pointerId);b.classList.add('on');BP[id]=down()});['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,e=>{b.classList.remove('on');up(BP[id]);BP[id]=null}))}
btn('bl',()=>mode=='play'?press('l'):0,release);btn('br',()=>mode=='play'?press('r'):0,release);
btn('bd',()=>{K.d=1},()=>{K.d=0});btn('bu',()=>{if(sea)K.u=1;else jump()},()=>{K.u=0});
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowDown:'d',s:'d'},KP={},UP=k=>k=='ArrowUp'||k=='w'||k==' ';
addEventListener('keydown',e=>{if(UP(e.key)){e.preventDefault();if(sea)K.u=1;else jump();return}const d=KM[e.key];if(d&&!e.repeat&&mode=='play')KP[e.key]=press(d)});
