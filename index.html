<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Interactivo - Personaje Animado</title>
    <style>
        /* ==========================================
           CONFIGURACIÓN Y ESTILOS DEL ESCENARIO
           ========================================== */
        :root {
            --g: 60px; /* Altura del suelo */
            --frame-width: 78px;  /* Ancho de cada fotograma del personaje */
            --frame-height: 78px; /* Alto de cada fotograma del personaje */
            --total-frames: 4;    /* Número de fotogramas en el sprite */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #e94560;
        }

        /* Contenedor principal del juego */
        #game-container {
            position: relative;
            width: 600px;
            height: 350px;
            background: linear-gradient(to bottom, #0f3460, #16213e);
            border: 4px solid #e94560;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Suelo del juego */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: var(--g);
            background-color: #0f0e17;
            border-top: 4px solid #e94560;
        }

        /* ==========================================
           ESTILOS DEL PERSONAJE Y ANIMACIÓN SPRITE
           ========================================== */
        #pl {
            position: absolute;
            bottom: var(--g);
            left: 50px;
            width: var(--frame-width);
            height: var(--frame-height);
            transition: left 0.1s linear; /* Movimiento suave horizontal */
        }

        #pi {
            width: 100%;
            height: 100%;
            /* REEMPLAZA 'personaje_sprite.png' POR LA RUTA DE TU IMAGEN SPRITE */
            background: url('personaje_sprite.png') left center no-repeat;
            background-size: auto 100%;
            /* Animación CSS con steps() para simular los fotogramas del GIF */
            animation: animarPersonaje 0.6s steps(var(--total-frames)) infinite;
        }

        /* Voltear personaje cuando camina a la izquierda */
        .mirar-izquierda {
            transform: scaleX(-1);
        }

        /* Definición de la secuencia de imágenes */
        @keyframes animarPersonaje {
            from { background-position: 0px 0; }
            to { background-position: calc(-1 * var(--frame-width) * var(--total-frames)) 0; }
        }

        /* ==========================================
           PANEL DE CONTROLES
           ========================================== */
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: #0f3460;
            color: #fff;
            border: 2px solid #e94560;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #e94560;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #8d99ae;
        }
    </style>
</head>
<body>

    <h1>Mundo Interactivo</h1>

    <div id="game-container">
        <!-- Personaje animado -->
        <div id="pl">
            <div id="pi"></div>
        </div>
        <!-- Suelo del escenario -->
        <div id="ground"></div>
    </div>

    <!-- Botones de control para dispositivos táctiles o mouse -->
    <div id="controls">
        <button class="btn" onclick="mover(-20)">◄ Izquierda</button>
        <button class="btn" onclick="saltar()">▲ Saltar</button>
        <button class="btn" onclick="mover(20)">Derecha ►</button>
    </div>

    <p class="instructions">Usa las flechas del teclado (◄ ►) para moverte y la barra espaciadora para saltar.</p>

    <!-- ==========================================
         LÓGICA EN JAVASCRIPT
         ========================================== -->
    <script>
        const personaje = document.getElementById('pl');
        const contenedor = document.getElementById('game-container');
        
        let posX = 50;
        let posY = 0;
        let esSaltando = false;
        const limiteDerecho = contenedor.clientWidth - 80;

        // Función para mover horizontalmente al personaje
        function mover(distancia) {
            posX += distancia;

            // Limitar dentro del escenario
            if (posX < 0) posX = 0;
            if (posX > limiteDerecho) posX = limiteDerecho;

            personaje.style.left = posX + 'px';

            // Cambiar orientación del personaje según la dirección
            if (distancia < 0) {
                personaje.classList.add('mirar-izquierda');
            } else if (distancia > 0) {
                personaje.classList.remove('mirar-izquierda');
            }
        }

        // Función para el salto del personaje
        function saltar() {
            if (esSaltando) return;
            esSaltando = true;

            let altura = 0;
            // Elevación
            let intervaloSubida = setInterval(() => {
                if (altura >= 100) {
                    clearInterval(intervaloSubida);
                    // Caída
                    let intervaloBajada = setInterval(() => {
                        if (altura <= 0) {
                            clearInterval(intervaloBajada);
                            esSaltando = false;
                        }
                        altura -= 5;
                        personaje.style.bottom = (60 + altura) + 'px';
                    }, 20);
                }
                altura += 5;
                personaje.style.bottom = (60 + altura) + 'px';
            }, 20);
        }

        // Detectar controles del teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                mover(-15);
            } else if (e.key === 'ArrowRight') {
                mover(15);
            } else if (e.key === ' ' || e.key === 'ArrowUp') {
                saltar();
            }
        });
    </script>
</body>
</html>
