<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paseo por el bosque</title><style>
:root{--card:#fffaf0;--ink:#2f3b2a;--ok:#5cb85c;--bad:#e8825c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2c3a33;--ink:#f3f1e4}}
:root[data-theme="dark"]{--card:#2c3a33;--ink:#f3f1e4}
html,body{height:100%;margin:0;overflow:hidden;background:#9bd8f5;font-family:"Trebuchet MS","Comic Sans MS",sans-serif;color:var(--ink)}
#stage{position:relative;height:100%;overflow:hidden;background:linear-gradient(#8fd3f4 0%,#d9f2d0 62%,#7bbf6a 62%)}
.layer{position:absolute;left:0;bottom:22%;white-space:nowrap}
#ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#8b6a3e 0 40px,#7d5f37 40px 80px);border-top:8px solid #5e9b4a}
#world{position:absolute;left:0;top:0;bottom:0;width:100%}
.t{position:absolute;bottom:20%;line-height:1}
.st{position:absolute;bottom:21%;font-size:84px;line-height:1;transition:transform .3s}
.st.talk{transform:scale(1.15) rotate(-4deg)}
#girl{position:absolute;left:10%;bottom:19%;width:150px;z-index:5;transform-origin:50% 100%}
#girl img{width:100%;display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#girl.walk{animation:paso .42s infinite alternate ease-in-out}
@keyframes paso{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-12px) rotate(4deg)}}
#panel{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,94%);background:var(--card);border-radius:26px;padding:14px 16px 16px;box-shadow:0 6px 0 rgba(0,0,0,.18);text-align:center;z-index:9}
#panel[hidden]{display:none}
#panel p{margin:0 0 6px;font-size:21px;line-height:1.3}
.vis{font-size:34px;line-height:1.25;margin:4px 0 10px;word-break:break-all}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opts button{min-width:84px;font:inherit;font-size:34px;font-weight:700;padding:8px 16px;border-radius:18px;border:4px solid #e4c97a;background:#fff3c4;color:#2f3b2a;cursor:pointer}
.opts button:focus-visible,.go:focus-visible{outline:4px solid #2f7fd6;outline-offset:2px}
.opts button.ok{background:var(--ok);border-color:#3f8f3f;color:#fff}
.opts button.no{background:var(--bad);border-color:#c4623d;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rep{position:absolute;right:10px;top:8px;border:0;background:none;font-size:26px;cursor:pointer}
#hud{position:absolute;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:28px;z-index:6;background:#fffaf0cc;color:#2f3b2a;border-radius:16px;padding:2px 12px}
#intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#2f6b3acc;color:#fff;text-align:center;padding:20px}
#intro h1{font-size:clamp(34px,8vw,60px);margin:0}
.go{font:inherit;font-size:30px;font-weight:700;padding:12px 34px;border-radius:30px;border:0;background:#ffd84d;color:#4a3300;cursor:pointer;box-shadow:0 6px 0 #c9a21e}
@media (prefers-reduced-motion:reduce){#girl.walk{animation:none}}
</style></head><body><div id="stage">

<div id="panel" hidden></div><div id="hud">⭐ 0</div>
<div id="intro"><h1>Paseo por el bosque 🌳</h1><p style="font-size:22px;margin:0">Camina, conoce a los animales y ayúdalos.</p><button class="go" id="start">¡Vamos!</button></div></div>
<script>
const $=s=>document.querySelector(s),W=()=>$('#stage').clientWidth;
const R=n=>Math.floor(Math.random()*n),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
let pos=0,idx=0,stars=0,voice=null,xs=[],busy=false,raf=0;
function pv(){const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('es'));voice=v.find(x=>/paulina|monica|mónica|helena|sabina|female|mujer|google/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pv;pv()}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='es-MX';u.pitch=1.9;u.rate=.95;speechSynthesis.speak(u)}
function draw(){$('#world').style.transform=`translateX(${-pos}px)`;$('#far').style.transform=`translateX(${-pos*.4}px)`}
function build(){const w=W(),end=w*.62+650*7+300;xs=[];for(let i=0;i<=6;i++)xs.push(w*.62+650*(i+1));
let h='',f='';for(let x=0;x<end+w;x+=110){h+=`<span class="t" style="left:${x+R(50)}px;font-size:${60+R(50)}px">${['🌲','🌳','🌲','🌿'][R(4)]}</span>`}
for(let x=0;x<end*.7;x+=130){f+=`<span style="font-size:120px">🌲</span>`}
$('#far').innerHTML=f;$('#world').innerHTML=h+xs.map((x,i)=>`<span class="st" id="s${i}" style="left:${x}px">${['🦉','🐿️','🐰','🦊','🐻','🦋','🎁'][i]}</span>`).join('');pos=0;draw()}
const WORDS=[['🍎','manzana','M'],['🐱','gato','G'],['☀️','sol','S'],['🐟','pez','P'],['🏠','casa','C'],['🌙','luna','L'],['🐶','perro','P'],['🌸','flor','F']];
const COL=[['🍓','fresa','red','rojo'],['🍌','plátano','gold','amarillo'],['🌿','hoja','green','verde'],['🫐','arándano','royalblue','azul']];
const opt3=(a,pool)=>sh([a,...sh(pool.filter(x=>x!=a)).slice(0,2)]);
const CH=[
()=>{const w=WORDS[R(8)];return{t:`¡Hola! Soy el búho. ¿Con qué letra empieza ${w[1]}?`,v:w[0],o:opt3(w[2],['A','B','C','D','L','M','P','S','T','F','G']),a:w[2],h:`Escucha: ${w[1]}`}},
()=>{const a=1+R(5),b=1+R(4);return{t:`Soy la ardilla. Tengo ${a} bellotas y encontré ${b} más. ¿Cuántas tengo?`,v:'🌰'.repeat(a)+' ➕ '+'🌰'.repeat(b),o:opt3(a+b,[a+b-1,a+b+1,a+b+2,a+b-2].filter(x=>x>0)),a:a+b,h:'Cuenta todas las bellotas juntas'}},
()=>{const n=3+R(7);return{t:'Soy el conejo. ¿Cuántas zanahorias ves?',v:'🥕'.repeat(n),o:opt3(n,[n-1,n+1,n+2,n-2].filter(x=>x>0)),a:n,h:'Cuenta con tu dedito'}},
()=>{const c=COL[R(4)];return{t:`Soy el zorro. ¿De qué color es la ${c[1]}?`,v:c[0],o:opt3(c[3],COL.map(x=>x[3])),a:c[3],h:'Mira bien el dibujo',col:1}},
()=>{const a=5+R(5),b=1+R(4);return{t:`Soy el oso. Tenía ${a} ollitas de miel y me comí ${b}. ¿Cuántas quedan?`,v:'🍯'.repeat(a),o:opt3(a-b,[a-b-1,a-b+1,a-b+2,a-b-2].filter(x=>x>=0)),a:a-b,h:`Quita ${b} ollitas`}},
()=>{const n=1+R(5);return{t:'Soy la mariposa. ¿Qué número falta?',v:`${n} , ${n+1} , ❓ , ${n+3}`,o:opt3(n+2,[n+1,n+4,n+5,n]),a:n+2,h:'Cuenta de uno en uno'}}];
function ask(i){const c=CH[i]();$('#s'+i).classList.add('talk');const p=$('#panel');p.hidden=false;
p.innerHTML=`<button class="rep" aria-label="Escuchar otra vez">🔊</button><p>${c.t}</p><div class="vis">${c.v}</div><div class="opts"></div>`;
const bx=p.querySelector('.opts');c.o.forEach(o=>{const b=document.createElement('button');b.textContent=o;if(c.col){b.style.cssText='font-size:24px';b.textContent=o}b.onclick=()=>{if(b.classList.contains('ok'))return;if(o==c.a){b.classList.add('ok');stars++;$('#hud').textContent='⭐ '+stars;say(['¡Muy bien!','¡Lo lograste!','¡Eso es!','¡Qué lista!'][R(4)]);setTimeout(()=>{p.hidden=true;$('#s'+i).classList.remove('talk');idx++;go()},1700)}else{b.classList.add('no');say('Casi. '+c.h)}};bx.appendChild(b)});
p.querySelector('.rep').onclick=()=>say(c.t);say(c.t)}
function go(){if(idx>6)return;const target=xs[idx]-W()*.62,from=pos,d=Math.abs(target-from),t0=performance.now(),dur=d/230*1000;const g=$('#girl');g.classList.add('walk');
(function f(n){const k=Math.min(1,(n-t0)/dur);pos=from+(target-from)*k;draw();if(k<1)raf=requestAnimationFrame(f);else{g.classList.remove('walk');if(idx==6)end();else ask(idx)}})(t0)}
function end(){const p=$('#panel');p.hidden=false;p.innerHTML=`<p>¡Encontramos el tesoro del bosque! 🎉</p><div class="vis">${'⭐'.repeat(stars)}</div><button class="go" id="again">Jugar otra vez</button>`;say('¡Lo logramos! Encontramos el tesoro. ¡Gracias por jugar conmigo!');$('#again').onclick=()=>{idx=0;stars=0;$('#hud').textContent='⭐ 0';p.hidden=true;build();go()}}
$('#start').onclick=()=>{$('#intro').remove();build();say('¡Hola! Vamos a pasear por el bosque.');setTimeout(go,1800)};
addEventListener('resize',()=>{if(!$('#intro')&&!busy){}});
</script></body></html>
